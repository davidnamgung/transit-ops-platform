<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Headway: a year of Boston subway service</title>
    <meta name="description" content="Explore a year of MBTA subway service day by day: closures, disruptions, and what the weather did." />
    <script>
      // Set the theme before the first paint so the page never flashes the wrong colors.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night');
          document.documentElement.dataset.theme = theme;
        } catch (e) { document.documentElement.dataset.theme = 'night'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
