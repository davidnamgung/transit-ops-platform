# Dependabot opens a pull request when a newer version of something this project pins is available. The
# pull request runs the same checks as any change (lint, 78+ tests, the website build), so a green check
# means the update is safe to merge. "cooldown" waits two weeks after a release before proposing it, which
# gives the community time to catch a bad release first.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      website-packages:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      python-packages:
        patterns: ["*"]
