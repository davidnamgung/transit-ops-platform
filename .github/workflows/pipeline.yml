# Pipeline: every day, download the newest MBTA, alert, and weather data, rebuild the warehouse,
# run every data-quality check, and export the website's data files. If anything fails, send an
# alert to Discord. Either way, record the run in the health history that the website's Platform
# Health page shows. If it passed, rebuild the website with the fresh data and publish it on
# GitHub Pages.
#
# It runs on a schedule and also whenever you press "Run workflow" on the Actions page.
# The actions below are pinned to an exact commit, with the version beside it, as in ci.yml.
name: Pipeline

on:
  schedule:
    # Every day at 09:17 UTC (04:17 or 05:17 in Boston). Cron always uses UTC. The odd minute is
    # deliberate: GitHub is busiest at the top of the hour and delays jobs scheduled then.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore the saved downloads and download everything again"
        type: boolean
        default: false
      test_alert:
        description: "Only send a test alert to Discord; do not run the pipeline"
        type: boolean
        default: false

# This workflow may only read the repository. It cannot change it or publish anything.
permissions:
  contents: read

# Never run two pipelines at once, and never cancel one that is already running.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    name: Download, build, check, export
    if: ${{ !inputs.test_alert }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv, the tool that manages this project's Python packages
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the exact package versions from uv.lock
        run: uv sync --locked --no-dev

      # The trip files are the bulk of the download (about 650 MB). GitHub keeps a saved copy
      # between runs, so a normal run only fetches the newest day or two. Each run saves a new
      # copy under its own name and restores the most recent one, whatever its name.
      - name: Restore the saved trip downloads
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/lamp
          key: raw-lamp-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            raw-lamp-

      - name: Run the pipeline
        env:
          MBTA_API_KEY: ${{ secrets.MBTA_API_KEY }}
        run: uv run python pipeline/run.py

      # Save the downloads even if a later stage failed, so the next run does not start over.
      - name: Save the trip downloads for the next run
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/lamp
          key: raw-lamp-${{ github.run_id }}-${{ github.run_attempt }}

      # Keep the run record and the exported files, including when the run failed.
      - name: Keep the run record and exported files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-output
          path: exports/
          retention-days: 30
          if-no-files-found: warn

      # If any step above failed, say so on Discord. This uses only the Python already on the
      # computer, so it still works when the failure happened before the packages were installed.
      - name: Send an alert to Discord
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 pipeline/notify.py

  # A separate job, so that only this one is allowed to write to the repository, and so that it still
  # runs when the pipeline job failed (a failure belongs in the history too).
  health:
    name: Record this run in the health history
    needs: run
    if: ${{ !cancelled() && !inputs.test_alert }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only to add commits to the pipeline-health branch; nothing else is touched
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # needed to push to the health branch
          fetch-depth: 1

      # The pipeline job leaves its run record here, including when it failed. If it failed before it
      # could, there is nothing to download, and the history records a setup failure instead.
      - name: Get this run's record
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pipeline-output
          path: exports

      - name: Add this run to the health history
        run: bash pipeline/publish_health.sh

  # Only after a run that passed every check: a failed run leaves the previous version of the site online,
  # so bad numbers never reach it. The site is plain files built from the four JSON files the pipeline exports.
  deploy:
    name: Publish the website
    needs: run
    if: ${{ needs.run.result == 'success' && !inputs.test_alert }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write      # to publish to GitHub Pages
      id-token: write   # GitHub Pages checks that the deployment really comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The pipeline job left the exported data files here. If they are missing, this step fails
      # and nothing is published, which is the right outcome.
      - name: Get the fresh data files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pipeline-output
          path: exports

      - name: Install the website's exact package versions
        working-directory: app
        run: npm ci

      - name: Copy the fresh data into the website
        working-directory: app
        run: npm run sync-data

      - name: Build the website
        working-directory: app
        run: npm run build

      - name: Package the website for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  test-alert:
    name: Send a test alert
    if: ${{ inputs.test_alert }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Send a test message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 pipeline/notify.py --test
