# CI: runs the lint check, the tests, and a build of the website on every push to main,
# on every pull request, and whenever you press "Run workflow" on the Actions page.
#
# The actions below are pinned to an exact commit (the long code), with the version beside it.
# That way a new release of someone else's action can never change what runs here unnoticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow may only read the repository. It cannot change it or publish anything.
permissions:
  contents: read

# If you push again while a run is still going, stop the old run and start the new one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv, the tool that manages this project's Python packages
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install the exact package versions from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

  site:
    name: Build the website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the exact package versions from package-lock.json
        run: npm ci

      - name: Build
        run: npm run build
