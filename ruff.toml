# Lint settings. These rules catch real mistakes (syntax errors, unused or undefined names,
# imports in the wrong place) without arguing about style.
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "app", "data", "exports", ".venv", "node_modules"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]  # assigning a small lambda to a name is fine here
